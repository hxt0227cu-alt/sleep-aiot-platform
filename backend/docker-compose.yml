version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: sleep_monitor_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sleep_monitor}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sleep_monitor_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sleep_monitor_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sleep_monitor_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2.0.18
    container_name: sleep_monitor_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - sleep_monitor_network
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/version", "-C", "1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sleep_monitor_backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sleep_monitor}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      MQTT_BROKER_URL: mqtt://mqtt:1883
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
      AGENT_DISPATCH_ENABLED: "true"
      AGENT_SERVICE_URL: http://agent-service:8000
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:?Set KNOWLEDGE_SERVICE_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    networks:
      - sleep_monitor_network
    restart: unless-stopped

  agent-service:
    build:
      context: ../services/agent-service
    environment:
      AGENT_RUN_DB: /var/lib/sleep-agent/agent-runs.sqlite3
      AGENT_QUEUE_MAX: ${AGENT_QUEUE_MAX:-10000}
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:-10}
      AGENT_MODEL_PROVIDER: ${AGENT_MODEL_PROVIDER:-deterministic}
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-}
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-qwen3.6-flash}
      AGENT_MODEL_MAX_CONCURRENCY: ${AGENT_MODEL_MAX_CONCURRENCY:-10}
      KNOWLEDGE_PROVIDER: service
      KNOWLEDGE_SERVICE_URL: http://backend:3000/api
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:?Set KNOWLEDGE_SERVICE_TOKEN}
    volumes:
      - agent_run_data:/var/lib/sleep-agent
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - sleep_monitor_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  agent_run_data:

networks:
  sleep_monitor_network:
    driver: bridge
