services:
  nginx:
    image: nginx:1.27-alpine
    container_name: sleep_monitor_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./ota:/var/www/ota:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v3.1.0
    container_name: sleep_monitor_certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./ota:/var/www/ota:ro
