[project]
name = "sleep-agent-service"
version = "0.1.0"
description = "Durable, policy-governed agent runtime boundary for the Sleep AIoT platform."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "openai>=1.68,<4",
  "langgraph>=1.2.10,<2",
  "langchain-core>=1.2.22,<2",
  "langsmith>=0.8.18,<1",
  "temporalio>=1.10,<2",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1"]

[tool.setuptools]
packages = ["app"]
