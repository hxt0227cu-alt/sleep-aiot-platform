name: Web CI

on:
  push:
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - '.github/workflows/web-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (self-healing on optional-dep flake)
        run: |
          npm ci
          if ! node -e "require('@tailwindcss/oxide')" >/dev/null 2>&1; then
            echo "oxide native binding missing (transient optional-dependency fetch failure); retrying npm ci"
            npm ci
            node -e "require('@tailwindcss/oxide')"
          fi
      - name: Build (Vite)
        run: npm run build
      - name: Run tests (Vitest)
        run: npm test
