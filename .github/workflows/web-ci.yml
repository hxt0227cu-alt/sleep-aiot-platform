name: Web CI

on:
  push:
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - '.github/workflows/web-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Diagnostic (oxide native binding)
        run: node -e "try{require('@tailwindcss/oxide');console.log('oxide OK')}catch(e){console.log('oxide FAIL:', e.message); if(e.cause){console.log('causes:', e.cause.map(function(c){return c.message}).join(' | '))}}"
      - name: Build (Vite)
        run: npm run build
      - name: Run tests (Vitest)
        run: npm test
