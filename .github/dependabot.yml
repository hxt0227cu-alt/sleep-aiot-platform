# Dependabot: keep dependencies up to date with automated pull requests.
# Dependency *vulnerabilities* are already gated in CI (Trivy); this adds the
# proactive upgrade channel. Group-related updates are batched to reduce noise.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/" # web client (root workspace)
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      web-ui:
        patterns: ["@mui/*", "@radix-ui/*", "lucide-react", "react", "react-dom"]

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/miniprogram"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/services/realtime-worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/services/telemetry-ingest"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/services/agent-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/services/feature-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "maven"
    directory: "/services/flink-telemetry-job"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
