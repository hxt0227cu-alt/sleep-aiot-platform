        envFrom:
        - secretRef:
            name: backend-api-secrets
        image: registry-vpc.cn-hangzhou.aliyuncs.com/registry.cn-hangzhou.aliyuncs.com/sleep-validation/backend-api@sha256:1111111111111111111111111111111111111111111111111111111111111111
        imagePullPolicy: IfNotPresent
        name: migrate
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: backend-api
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: agent-service
    release: kube-prometheus-stack
  name: agent-service
  namespace: sleep-platform
spec:
  groups:
  - name: agent-service.availability
    rules:
    - alert: AgentServiceTargetAbsent
      annotations:
        description: Check the ServiceMonitor selector, NetworkPolicy, and Pod readiness.
        summary: Agent Service has no Prometheus target
      expr: absent(up{job="agent-service"})
      for: 5m
      labels:
        severity: critical
    - alert: AgentServiceQueueSaturated
      annotations:
        description: Pause nonessential Agent traffic and inspect model latency or
          provider throttling.
        summary: Agent admission queue is above 80%
      expr: sleep_agent_queue_depth > 8000
      for: 5m
      labels:
        severity: warning
    - alert: AgentServiceModelFailureRateHigh
      annotations:
        description: Check Bailian quota, latency, circuit breaker state, and fallback
          volume.
        summary: Agent model failure rate exceeds 20%
      expr: rate(sleep_agent_model_calls_total{outcome="failure"}[10m]) / clamp_min(rate(sleep_agent_model_calls_total{outcome=~"success|failure"}[10m]),
        0.001) > 0.2
      for: 10m
      labels:
        severity: warning
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/name: backend-api
    release: kube-prometheus-stack
  name: backend-api
  namespace: sleep-platform
spec:
  groups:
  - name: backend-api.scrape
    rules:
    - alert: BackendApiTargetDown
      annotations:
        description: Prometheus 无法抓取该副本。常见原因按概率排序： (1) NetworkPolicy 未放行 monitoring
          命名空间； (2) Pod 未就绪或正在滚动更新； (3) /api/metrics 路径变更（注意全局前缀 api）。
        runbook: platform/postgres/backup/README.md 同级的 observability 章节；先 kubectl
          exec 到 monitoring 侧 curl 验证连通性
        summary: backend-api 抓取目标不可达 ({{ $labels.instance }})
      expr: up{job="backend-api"} == 0
      for: 3m
      labels:
        severity: critical
    - alert: BackendApiMetricsAbsent
      annotations:
        description: ServiceMonitor 可能未被 Prometheus 实例的 serviceMonitorSelector 匹配，
          或 label release 与集群约定不一致。这是"配置了监控但完全没生效"的静默失败。
        summary: backend-api 没有任何抓取目标
      expr: absent(up{job="backend-api"})
      for: 10m
      labels:
        severity: critical
  - name: backend-api.slo
    rules:
    - alert: BackendApiHighErrorRate
      annotations:
        description: 当前 5xx 比例 {{ $value | humanizePercentage }}，持续 5 分钟。
        summary: backend-api 5xx 比例超过 5%
      expr: sum(rate(sleep_http_requests_total{status_code=~"5.."}[5m])) / sum(rate(sleep_http_requests_total[5m]))
        > 0.05
      for: 5m
      labels:
        severity: critical
    - alert: BackendApiHighLatencyP95
      annotations:
        description: 当前 P95 = {{ $value }}s。优先查 dependency 延迟与 LLM 调用耗时。
        summary: backend-api P95 延迟超过 1s
      expr: |-
        histogram_quantile(

          0.95,
          sum(rate(sleep_http_request_duration_seconds_bucket[5m])) by (le)
        ) > 1
      for: 10m
      labels:
        severity: warning
    - alert: BackendApiLlmFailureRate
      annotations:
        description: 上游模型服务可能限流或不可用。确认降级路径是否生效 （助手功能应降级而非拖垮整个请求链路）。
        summary: LLM 调用失败率超过 20%
      expr: sum(rate(sleep_llm_requests_total{outcome!="success"}[10m])) / sum(rate(sleep_llm_requests_total[10m]))
        > 0.2
      for: 10m
      labels:
        severity: warning
  - name: backend-api.dependencies
    rules:
    - alert: BackendApiDependencyDown
      annotations:
        description: readiness 探针已判定该依赖不可用，Pod 会被摘出 Service。 若三副本同时命中，服务将完全不可用。
        summary: 依赖 {{ $labels.dependency }} 不可用
      expr: sleep_dependency_health == 0
      for: 2m
      labels:
        severity: critical
    - alert: BackendApiMqttDisconnected
      annotations:
        description: 该副本无法收发设备消息。使用共享订阅时，断开的副本会把负载 转移给其余副本，需确认剩余副本能否承接。
        summary: MQTT 连接断开 ({{ $labels.instance }})
      expr: sleep_mqtt_connected == 0
      for: 2m
      labels:
        severity: critical
    - alert: BackendApiWsConnectionBudgetHigh
      annotations:
        description: WebSocket 连接是副本本地状态，HPA 基于 CPU 扩容不会迁移既有连接。 接近预算意味着新连接可能被拒绝，需提前扩容或调高单副本预算。
        summary: WS 连接数达到副本预算的 {{ $value | humanizePercentage }}
      expr: sleep_ws_connection_budget_ratio > 0.8
      for: 5m
      labels:
        severity: warning
    - alert: BackendApiWsConnectionBudgetCritical
      annotations:
        summary: WS 连接数即将耗尽副本预算 ({{ $labels.instance }})
      expr: sleep_ws_connection_budget_ratio > 0.95
      for: 2m
      labels:
        severity: critical
    - alert: BackendApiFanoutPublishFailing
      annotations:
        description: Redis Pub/Sub 发布失败意味着连接在其他副本上的客户端收不到推送。 故障是"部分用户静默收不到数据"，不会体现在
          HTTP 错误率上。
        summary: 跨副本实时扇出发布失败 ({{ $labels.kind }})
      expr: rate(sleep_fanout_publish_failures_total[5m]) > 0
      for: 5m
      labels:
        severity: critical
    - alert: BackendApiLeaderLockStarved
      annotations:
        description: 周期性任务（如设备在线巡检）可能已停止执行。检查 Redis 可用性与锁 TTL。
        summary: 定时任务领导者锁长期无人获得
      expr: sum(increase(sleep_leader_lock_runs_total{outcome="acquired"}[30m])) ==
        0 and sum(increase(sleep_leader_lock_runs_total[30m])) > 0
      for: 5m
      labels:
        severity: critical
  - name: backend-api.data-protection
    rules:
    - alert: PostgresBackupJobFailed
      annotations:
        description: 备份失败会直接抬高 RPO。查看 Job 日志并手动补一次备份。
        summary: PostgreSQL 备份任务失败
      expr: kube_job_status_failed{namespace="sleep-platform", job_name=~"postgres-backup.*"}
        > 0
      for: 5m
      labels:
        severity: critical
    - alert: PostgresBackupStale
      annotations:
        description: 当前采用逻辑全量备份，RPO 等于备份间隔。备份停摆意味着 RPO 持续恶化，且故障时可能丢失一天以上数据。
        summary: PostgreSQL 已超过 26 小时没有成功备份
      expr: |-
        time() - max(kube_cronjob_status_last_successful_time{

          namespace="sleep-platform", cronjob="postgres-backup"
        }) > 93600
      for: 30m
      labels:
        severity: critical
    - alert: PostgresBackupMetricsAbsent
      annotations:
        description: 可能未安装 kube-state-metrics，或 CronJob 未部署。 在补齐之前，备份处于"无人监督"状态。
        summary: 拿不到备份 CronJob 的状态指标
      expr: absent(kube_cronjob_status_last_successful_time{namespace="sleep-platform",
        cronjob="postgres-backup"})
      for: 1h
      labels:
        severity: warning
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/name: agent-service
    release: kube-prometheus-stack
  name: agent-service
  namespace: sleep-platform
spec:
  endpoints:
  - interval: 30s
    path: /metrics
    port: http
    scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
    - sleep-platform
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-service
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/name: backend-api
    release: kube-prometheus-stack
  name: backend-api
  namespace: sleep-platform
spec:
  endpoints:
  - honorLabels: false
    interval: 30s
    path: /api/metrics
    port: http
    relabelings:
    - sourceLabels:
      - __meta_kubernetes_pod_name
      targetLabel: instance
    - sourceLabels:
      - __meta_kubernetes_pod_node_name
      targetLabel: node
    scheme: http
    scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
    - sleep-platform
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-api
---
apiVersion: networking.k8s.io/v1
