apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: agent-service
  name: agent-service
  namespace: sleep-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-service
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: agent-service
            topologyKey: kubernetes.io/hostname
      containers:
      - env:
        - name: AGENT_STATE_BACKEND
          value: postgres
        - name: AGENT_COORDINATOR
          value: temporal
        - name: TEMPORAL_ADDRESS
          value: temporal-frontend:7233
        - name: TEMPORAL_NAMESPACE
          value: default
        - name: TEMPORAL_TASK_QUEUE
          value: sleep-agent-runs
        - name: AGENT_STATE_DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: database-url
              name: agent-service-secrets
        - name: AGENT_STATE_POOL_MAX
          value: "10"
        - name: AGENT_MODEL_PROVIDER
          value: openai_compatible
        - name: AGENT_MODEL_NAME
          value: qwen3.6-flash
        - name: AGENT_MODEL_MAX_CONCURRENCY
          value: "50"
        - name: AGENT_MODEL_TIMEOUT_SECONDS
          value: "45"
        - name: AGENT_MODEL_FAILURE_MODE
          value: fallback
        - name: FEATURE_PROVIDER
          value: service
        - name: FEATURE_SERVICE_URL
          value: http://feature-service:8101
        - name: AGENT_MODEL_API_KEY
          valueFrom:
            secretKeyRef:
              key: model-api-key
              name: agent-service-secrets
        - name: AGENT_MODEL_BASE_URL
          valueFrom:
            secretKeyRef:
              key: model-base-url
              name: agent-service-secrets
        - name: FEATURE_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              key: feature-service-token
              name: agent-service-secrets
        image: registry-vpc.cn-hangzhou.aliyuncs.com/registry.cn-hangzhou.aliyuncs.com/sleep-validation/agent-service@sha256:2222222222222222222222222222222222222222222222222222222222222222
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
        name: agent-service
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agent-service
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: agent-service
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
      volumes:
      - emptyDir: {}
        name: tmp
