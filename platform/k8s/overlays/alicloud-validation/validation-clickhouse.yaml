apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-validation-init
  namespace: sleep-platform
data:
  001-e3a-feature-table.sql: |
    CREATE DATABASE IF NOT EXISTS ads;
    CREATE TABLE IF NOT EXISTS ads.ads_agent_device_sleep_features
    (
      tenant_id String,
      device_id String,
      window_days UInt8,
      window_start DateTime64(3, 'UTC'),
      window_end DateTime64(3, 'UTC'),
      telemetry_events UInt64,
      observed_hours UInt64,
      avg_heart_rate Nullable(Float64),
      avg_breathing_rate Nullable(Float64),
      total_body_movement Float64,
      deep_sleep_ratio Float64,
      awake_ratio Float64,
      p95_ingest_delay_ms Float64,
      source_max_occurred_at DateTime64(3, 'UTC'),
      refreshed_at DateTime64(3, 'UTC')
    )
    ENGINE = ReplacingMergeTree(refreshed_at)
    ORDER BY (tenant_id, device_id, window_days);
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: sleep-platform
  labels:
    app.kubernetes.io/name: clickhouse
    sleep.platform/topology: validation-only
spec:
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: sleep-platform
  labels:
    app.kubernetes.io/name: clickhouse
    sleep.platform/topology: validation-only
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        sleep.platform/topology: validation-only
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8.14.39-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: feature-service-secrets
                  key: clickhouse-user
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: feature-service-secrets
                  key: clickhouse-password
          ports:
            - name: http
              containerPort: 8123
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", "clickhouse-client --user \"$CLICKHOUSE_USER\" --password \"$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' | grep -qx 1"]
            failureThreshold: 60
            periodSeconds: 3
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "clickhouse-client --user \"$CLICKHOUSE_USER\" --password \"$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' | grep -qx 1"]
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "clickhouse-client --user \"$CLICKHOUSE_USER\" --password \"$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' | grep -qx 1"]
            periodSeconds: 15
            timeoutSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: logs
              mountPath: /var/log/clickhouse-server
            - name: tmp
              mountPath: /tmp
            - name: init
              mountPath: /docker-entrypoint-initdb.d/001-e3a-feature-table.sql
              subPath: 001-e3a-feature-table.sql
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: init
          configMap:
            name: clickhouse-validation-init
