apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-api-to-validation-redis
  namespace: sleep-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend-api
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: validation-redis-ingress
  namespace: sleep-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend-api
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
