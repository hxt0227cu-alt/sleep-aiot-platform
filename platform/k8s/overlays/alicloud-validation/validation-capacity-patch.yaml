apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: sleep-platform
spec:
  replicas: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: sleep-platform
spec:
  replicas: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-service
  namespace: sleep-platform
spec:
  replicas: 2
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-api
  namespace: sleep-platform
spec:
  minReplicas: 2
  maxReplicas: 3
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-api
  namespace: sleep-platform
spec:
  minAvailable: 1
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-service
  namespace: sleep-platform
spec:
  minAvailable: 1
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: feature-service
  namespace: sleep-platform
spec:
  minAvailable: 1
