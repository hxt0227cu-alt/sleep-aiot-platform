apiVersion: batch/v1
kind: Job
metadata:
  name: backend-db-migrate
  namespace: sleep-platform
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-db-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: backend-api
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.example.com/sleep/backend-api:REPLACE_WITH_IMMUTABLE_DIGEST
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - >-
              ./node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma
              && psql "$DATABASE_URL" -v ON_ERROR_STOP=1
              -f prisma/setup-timescaledb.sql
          envFrom:
            - secretRef:
                name: backend-api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
