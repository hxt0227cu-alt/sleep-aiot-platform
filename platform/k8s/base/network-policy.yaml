  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend-api
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - protocol: TCP
          port: 7233
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: feature-service
      ports:
        - protocol: TCP
          port: 8101
    - to:
        - namespaceSelector: {}
      ports:
