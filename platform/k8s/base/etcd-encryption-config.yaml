# etcd 静态加密配置
#
# 启用 etcd 中 Secret 资源的静态加密，确保敏感数据在存储层加密。

apiVersion: apiserver.config.k8s.io/v1
kind: EncryptionConfiguration
metadata:
  name: etcd-encryption-config
resources:
  - resources:
      - secrets
    providers:
      # 首选：使用 KMS 插件（阿里云 KMS）
      - kms:
          name: aliyun-kms
          endpoint: unix:///var/run/kmsplugin/socket.sock
          cachesize: 1000
          timeout: 3s
      # 备选：使用 AES-CBC 静态密钥
      - aescbc:
          keys:
            - name: key1
              secret: ${ETCD_ENCRYPTION_KEY}  # 通过环境变量注入，32字节 base64
            - name: key2
              secret: ${ETCD_ENCRYPTION_KEY_2}  # 轮换密钥
      # 最后：identity（不加密，用于迁移期间）
      - identity: {}
  - resources:
      - configmaps
    providers:
      - aescbc:
          keys:
            - name: configmap-key1
              secret: ${ETCD_CONFIGMAP_ENCRYPTION_KEY}
      - identity: {}
---
# Reason: control-plane KMS plugin requires upstream root image + hostPath socket; forcing non-root
# would risk breaking the API server etcd-encryption path. By-design exception (see docs/security.md).
# KMS 插件部署（DaemonSet，仅控制平面节点）
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kms-plugin
  namespace: kube-system
  labels:
    app: kms-plugin
spec:
  selector:
    matchLabels:
      app: kms-plugin
  template:
    metadata:
      labels:
        app: kms-plugin
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: kms-plugin
          image: registry.cn-shenzhen.aliyuncs.com/acs/kms-plugin:v1.0.0
          imagePullPolicy: IfNotPresent
          args:
            - --key-ids=${ALIYUN_KMS_KEY_ID}
            - --region=cn-shenzhen
            - --socket-path=/var/run/kmsplugin/socket.sock
            - --log-level=info
          env:
            - name: ALIYUN_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: alicloud-credentials
                  key: accessKeyId
            - name: ALIYUN_ACCESS_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: alicloud-credentials
                  key: accessKeySecret
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/kmsplugin
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/run/kmsplugin
            type: DirectoryOrCreate
---
# 加密验证脚本（ConfigMap）
apiVersion: v1
kind: ConfigMap
metadata:
  name: etcd-encryption-verify
  namespace: kube-system
data:
  verify.sh: |
    #!/bin/bash
    set -e

    echo "=== etcd 加密验证 ==="

    # 1. 创建测试 Secret
    kubectl create secret generic encryption-test --from-literal=key=test-value -n default --dry-run=client -o yaml | kubectl apply -f -

    # 2. 直接从 etcd 读取（需要 etcdctl 权限）
    # ETCDCTL_API=3 etcdctl get /registry/secrets/default/encryption-test --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key --endpoints=https://127.0.0.1:2379

    # 3. 检查输出是否包含 k8s:enc:kms:v1: 前缀（表示已加密）
    # 如果包含明文 "test-value"，说明加密未生效

    # 4. 清理测试 Secret
    kubectl delete secret encryption-test -n default --ignore-not-found

    echo "验证完成"
---
# 密钥轮换策略
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-encryption-key-rotation
  namespace: kube-system
spec:
  schedule: "0 0 1 */3 *"  # 每3个月
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: etcd-encryption-rotator
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: OnFailure
          containers:
            - name: key-rotation
              image: bitnami/kubectl:1.28
              command:
                - /bin/sh
                - -c
                - |
                  echo "Starting etcd encryption key rotation at $(date)"
                  # 1. 在 EncryptionConfiguration 中添加新密钥
                  # 2. 重启 API Server
                  # 3. 执行所有 Secret 的 rewrite 操作
                  # kubectl get secrets --all-namespaces -o json | kubectl replace -f -
                  # 4. 验证所有 Secret 已使用新密钥加密
                  # 5. 移除旧密钥
                  echo "Key rotation completed at $(date)"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: tmp
              emptyDir: {}
