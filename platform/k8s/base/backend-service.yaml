apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-api
  namespace: sleep-platform
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: sleep-platform
  labels:
    app.kubernetes.io/name: backend-api
spec:
  selector:
    app.kubernetes.io/name: backend-api
  ports:
    - name: http
      port: 3000
      targetPort: http

