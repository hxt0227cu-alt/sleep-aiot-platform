apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-service
  namespace: sleep-platform
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: sleep-platform
  labels:
    app.kubernetes.io/name: agent-service
spec:
  selector:
    app.kubernetes.io/name: agent-service
  ports:
    - name: http
      port: 8000
      targetPort: http
