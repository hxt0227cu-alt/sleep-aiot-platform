# Sealed Secrets 引导配置
#
# 使用 Bitnami Sealed Secrets 实现 Secret 的安全加密存储，
# 允许将加密后的 Secret 提交到 Git 仓库。

apiVersion: v1
kind: Namespace
metadata:
  name: sealed-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sealed-secrets-controller
  namespace: sealed-secrets
---
# Reason: Sealed Secrets controller unseals into arbitrary namespaces (cluster-wide by design).
# By-design exception (see docs/security.md).
#trivy:ignore:AVD-KSV-0041
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-unsealer
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["bitnami.com"]
    resources: ["sealedsecrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sealed-secrets-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrets-unsealer
subjects:
  - kind: ServiceAccount
    name: sealed-secrets-controller
    namespace: sealed-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sealed-secrets-controller
  namespace: sealed-secrets
  labels:
    app: sealed-secrets-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sealed-secrets-controller
  template:
    metadata:
      labels:
        app: sealed-secrets-controller
    spec:
      serviceAccountName: sealed-secrets-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sealed-secrets-controller
          image: bitnami/sealed-secrets-controller:v0.24.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SEALED_SECRETS_KEY_SIZE
              value: "4096"
            - name: SEALED_SECRETS_KEY_RENEW_PERIOD
              value: "720h"  # 30天
            - name: SEALED_SECRETS_UPDATE_STATUS
              value: "true"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sealed-secrets-controller
  namespace: sealed-secrets
spec:
  type: ClusterIP
  selector:
    app: sealed-secrets-controller
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
# Sealed Secret 示例
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: example-secret
  namespace: backend
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
spec:
  encryptedData:
    # 使用 kubeseal 命令加密后的值
    # kubeseal --controller-name=sealed-secrets-controller --controller-namespace=sealed-secrets --format=yaml < secret.yaml
    password: AgB...encrypted...data...
  template:
    metadata:
      name: example-secret
      namespace: backend
    type: Opaque
---
# 密钥轮换 CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sealed-secrets-key-rotation
  namespace: sealed-secrets
spec:
  schedule: "0 0 1 * *"  # 每月1号
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: sealed-secrets-controller
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: OnFailure
          containers:
            - name: key-rotation
              image: bitnami/kubectl:1.28
              command:
                - /bin/sh
                - -c
                - |
                  echo "Rotating Sealed Secrets keys..."
                  kubectl annotate sealedsecret -n sealed-secrets -l app=sealed-secrets-controller sealedsecrets.bitnami.com/key-renew-at="$(date -Iseconds)" --overwrite
                  echo "Key rotation initiated"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: tmp
              emptyDir: {}
