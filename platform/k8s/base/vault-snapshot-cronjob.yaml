apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-snapshot
  namespace: vault
spec:
  schedule: "0 */6 * * *"  # 每6小时
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: vault-snapshot
        spec:
          serviceAccountName: vault-snapshot
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 100
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: OnFailure
          containers:
            - name: vault-snapshot
              image: hashicorp/vault:1.15.4
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Starting Vault snapshot at $(date)"

                  # 登录 Vault
                  vault login -method=kubernetes role=snapshot jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)

                  # 创建快照
                  SNAPSHOT_FILE="/snapshots/vault-snapshot-$(date +%Y%m%d-%H%M%S).snap"
                  vault operator raft snapshot save "$SNAPSHOT_FILE"

                  # 验证快照
                  SNAPSHOT_SIZE=$(stat -c%s "$SNAPSHOT_FILE")
                  echo "Snapshot created: $SNAPSHOT_FILE (size: $SNAPSHOT_SIZE bytes)"

                  if [ "$SNAPSHOT_SIZE" -lt 1000 ]; then
                    echo "ERROR: Snapshot file too small, possible failure"
                    exit 1
                  fi

                  # 上传到对象存储（使用 rclone 或 aws cli）
                  # rclone copy "$SNAPSHOT_FILE" aliyun:vault-snapshots/

                  # 清理旧快照（保留7天）
                  find /snapshots -name "vault-snapshot-*.snap" -mtime +7 -delete

                  echo "Vault snapshot completed successfully at $(date)"
              env:
                - name: VAULT_ADDR
                  value: "http://vault.vault.svc.cluster.local:8200"
                - name: VAULT_SKIP_VERIFY
                  value: "true"
              volumeMounts:
                - name: snapshots
                  mountPath: /snapshots
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: snapshots
              persistentVolumeClaim:
                claimName: vault-snapshots-pvc
            - name: tmp
              emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-snapshots-pvc
  namespace: vault
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: gp3
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-snapshot
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-snapshot
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-snapshot
  namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-snapshot
subjects:
  - kind: ServiceAccount
    name: vault-snapshot
    namespace: vault
