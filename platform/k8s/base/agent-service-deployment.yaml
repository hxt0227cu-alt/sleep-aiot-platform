apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: sleep-platform
  labels:
    app.kubernetes.io/name: agent-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-service
    spec:
      serviceAccountName: agent-service
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: agent-service
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agent-service
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-service
          image: registry.example.com/sleep/agent-service:REPLACE_WITH_IMMUTABLE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: AGENT_STATE_BACKEND
              value: postgres
            - name: AGENT_COORDINATOR
              value: temporal
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: TEMPORAL_TASK_QUEUE
              value: sleep-agent-runs
            - name: AGENT_STATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-service-secrets
                  key: database-url
            - name: AGENT_STATE_POOL_MAX
              value: "10"
            - name: AGENT_MODEL_PROVIDER
              value: openai_compatible
            - name: AGENT_MODEL_NAME
              value: qwen3.6-flash
            - name: AGENT_MODEL_MAX_CONCURRENCY
              value: "50"
            - name: AGENT_MODEL_TIMEOUT_SECONDS
              value: "45"
            - name: AGENT_MODEL_FAILURE_MODE
              value: fallback
            - name: FEATURE_PROVIDER
              value: service
            - name: FEATURE_SERVICE_URL
              value: http://feature-service:8101
            - name: KNOWLEDGE_PROVIDER
              value: service
            - name: KNOWLEDGE_SERVICE_URL
              value: http://backend-api:3000/api
            - name: KNOWLEDGE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-service-secrets
                  key: knowledge-service-token
            - name: AGENT_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-service-secrets
                  key: model-api-key
            - name: AGENT_MODEL_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-service-secrets
                  key: model-base-url
            - name: FEATURE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-service-secrets
                  key: feature-service-token
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
