# Secret 访问 RBAC 策略
# 遵循最小权限原则，严格控制 Secret 的访问权限

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
    resourceNames: []  # 空表示所有，使用时应在 RoleBinding 中限定命名空间
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-auditor
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["audit.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
# 禁止默认 ServiceAccount 访问 Secret
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deny-secret-access
rules: []  # 空规则，通过 RoleBinding 实现拒绝
---
# 各命名空间的 Secret 访问角色
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-secret-reader
  namespace: backend
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      - backend-db-secret
      - backend-redis-secret
      - backend-jwt-secret
      - backend-mqtt-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iot-secret-reader
  namespace: iot
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      - emqx-tls
      - emqx-db-secret
      - device-ca-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: database-secret-manager
  namespace: database
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
    resourceNames:
      - postgres-secret
      - postgres-exporter-dsn
      - clickhouse-secret
---
# ServiceAccount 绑定示例
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-app
  namespace: backend
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-app-secret-reader
  namespace: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backend-secret-reader
subjects:
  - kind: ServiceAccount
    name: backend-app
    namespace: backend
---
# 安全策略：禁止在环境变量中直接引用 Secret（应使用 volumeMount）
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredLabels
metadata:
  name: secret-usage-policy
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
  parameters:
    labels:
      - key: secrets-managed
        allowedRegex: "^(true|external-secrets)$"
