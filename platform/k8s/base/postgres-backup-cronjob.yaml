apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: sleep-platform
  labels:
    app.kubernetes.io/part-of: sleep-platform
    app.kubernetes.io/component: postgres
spec:
  schedule: "0 2 * * *"
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: sleep-platform
            app.kubernetes.io/component: postgres
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              # 复用与 PG 服务端对齐的镜像（含 pg_dump/pg_restore）。
              # PITR 阶段应替换为自带 wal-g 的专用镜像。
              image: timescale/timescaledb:2.24.0-pg17
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
                  /scripts/backup.sh
              envFrom:
                - secretRef:
                    name: postgres-backup-secret
              env:
                - name: BACKUP_DIR
                  value: /backups
                - name: BACKUP_RETENTION_DAYS
                  value: "7"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: backups
                  mountPath: /backups
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: tmp
              emptyDir: {}
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backup-pvc
            - name: scripts
              configMap:
                name: postgres-backup-scripts
                defaultMode: 0755
