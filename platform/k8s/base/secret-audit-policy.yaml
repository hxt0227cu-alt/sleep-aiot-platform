# Secret 审计策略
#
# 定义 Secret 的访问审计规则，确保所有敏感操作都被记录和监控。

apiVersion: audit.k8s.io/v1
kind: Policy
metadata:
  name: secret-audit-policy
rules:
  # 记录所有 Secret 的写操作
  - level: RequestResponse
    resources:
      - group: ""
        resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete"]
    omitStages:
      - RequestReceived

  # 记录 Secret 的读操作（仅记录元数据，不记录内容）
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets"]
    verbs: ["get", "list", "watch"]
    omitStages:
      - RequestReceived

  # 记录 ConfigMap 的写操作（可能包含敏感信息）
  - level: Request
    resources:
      - group: ""
        resources: ["configmaps"]
    verbs: ["create", "update", "patch", "delete"]
    omitStages:
      - RequestReceived

  # 记录 ServiceAccount Token 的创建
  - level: RequestResponse
    resources:
      - group: ""
        resources: ["serviceaccounts/token"]
    verbs: ["create"]
    omitStages:
      - RequestReceived

  # 记录 RBAC 变更
  - level: RequestResponse
    resources:
      - group: "rbac.authorization.k8s.io"
        resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["create", "update", "patch", "delete"]
    omitStages:
      - RequestReceived

  # 记录 Namespace 变更
  - level: Metadata
    resources:
      - group: ""
        resources: ["namespaces"]
    verbs: ["create", "delete"]

  # 其他资源不记录
  - level: None
    resources:
      - group: ""
        resources: ["events"]
    verbs: ["get", "list", "watch"]
---
# Secret 审计监控规则（Prometheus）
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: secret-audit-alerts
  namespace: monitoring
spec:
  groups:
    - name: secret-audit
      rules:
        - alert: SecretAccessAnomaly
          expr: |
            rate(apiserver_audit_event_total{resource="secrets",verb="get"}[5m]) > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Secret 读取异常频繁"
            description: "5分钟内 Secret 读取次数超过 100 次/分钟，可能存在异常访问"

        - alert: SecretModifiedOutsideCI
          expr: |
            increase(apiserver_audit_event_total{resource="secrets",verb=~"create|update|patch|delete",user!~"system:serviceaccount:ci-cd:.*"}[1h]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "非 CI/CD 流程修改 Secret"
            description: "检测到非 CI/CD ServiceAccount 修改了 Secret，请立即核查"

        - alert: SecretDeleted
          expr: |
            increase(apiserver_audit_event_total{resource="secrets",verb="delete"}[1h]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Secret 被删除"
            description: "检测到 Secret 被删除操作，请确认是否为预期操作"

        - alert: RBACPolicyChanged
          expr: |
            increase(apiserver_audit_event_total{group="rbac.authorization.k8s.io",verb=~"create|update|patch|delete"}[1h]) > 0
          for: 1m
          labels:
            severity: high
          annotations:
            summary: "RBAC 策略变更"
            description: "检测到 RBAC 策略变更，请确认是否为预期操作"
---
# Secret 审计日志导出配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-audit-config
  namespace: kube-system
data:
  audit-policy.yaml: |
    # 引用上方的 Policy 定义
    # 实际部署时通过 --audit-policy-file 参数挂载
  audit-log-format: json
  audit-log-maxage: "30"
  audit-log-maxbackup: "10"
  audit-log-maxsize: "100"
