apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: secrets
---
# Reason: External Secrets operator must manage Secrets cluster-wide by design (ClusterSecretStore
# sync); scope is controlled at the ClusterSecretStore level. By-design exception (see docs/security.md).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores", "clustersecretstores"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["external-secrets.io"]
    resources:
      - "externalsecrets/status"
      - "secretstores/status"
      - "clustersecretstores/status"
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-secrets
  namespace: secrets
  labels:
    app: external-secrets
spec:
  replicas: 2
  selector:
    matchLabels:
      app: external-secrets
  template:
    metadata:
      labels:
        app: external-secrets
    spec:
      serviceAccountName: external-secrets
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: external-secrets
          image: ghcr.io/external-secrets/external-secrets:v0.9.9
          imagePullPolicy: IfNotPresent
          args:
            - --concurrent=4
            - --cert-dir=/tmp/certs
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: ALICLOUD_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: alicloud-credentials
                  key: accessKeyId
            - name: ALICLOUD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: alicloud-credentials
                  key: accessKeySecret
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: external-secrets
  namespace: secrets
spec:
  type: ClusterIP
  selector:
    app: external-secrets
  ports:
    - port: 8080
      targetPort: 8080
      name: metrics
---
# Vault SecretStore 示例
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets
            namespace: secrets
---
# 阿里云 KMS SecretStore 示例
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: alicloud-kms
spec:
  provider:
    alibaba:
      regionId: "cn-shenzhen"
      auth:
        secretRef:
          accessKeyID:
            name: alicloud-credentials
            key: accessKeyId
            namespace: secrets
          accessKeySecret:
            name: alicloud-credentials
            key: accessKeySecret
            namespace: secrets
