apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-service
  namespace: sleep-platform
  labels:
    app.kubernetes.io/name: feature-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: feature-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feature-service
    spec:
      serviceAccountName: feature-service
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: feature-service
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: feature-service
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: feature-service
          image: registry.example.com/sleep/feature-service:REPLACE_WITH_IMMUTABLE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8101
          env:
            - name: FEATURE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: feature-service-secrets
                  key: service-token
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: feature-service-secrets
                  key: clickhouse-url
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: feature-service-secrets
                  key: clickhouse-user
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: feature-service-secrets
                  key: clickhouse-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
