apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sleep-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_OWNER/REPLACE_REPOSITORY.git
    targetRevision: main
    path: platform/k8s/overlays/validation
  destination:
    server: https://kubernetes.default.svc
    namespace: sleep-platform
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

