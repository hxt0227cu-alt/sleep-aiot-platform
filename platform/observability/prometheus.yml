global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: backend-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ["backend:3000"]
  - job_name: agent-service
    metrics_path: /metrics
    static_configs:
      - targets: ["agent-service:8000"]
  - job_name: feature-service
    metrics_path: /metrics
    static_configs:
      - targets: ["feature-service:8101"]
  - job_name: telemetry-ingest
    metrics_path: /metrics
    static_configs:
      - targets: ["telemetry-ingest:9102"]
  - job_name: realtime-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["realtime-worker:9103"]
  - job_name: flink-jobmanager
    metrics_path: /metrics
    static_configs:
      - targets: ["flink-jobmanager:9249"]
  - job_name: flink-taskmanager
    metrics_path: /metrics
    static_configs:
      - targets: ["flink-taskmanager:9249"]
